<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Pixel Explorer</title>
    <style>
        :root {
            --primary: #1C355E;
            --accent: #FFD700;
            --bg: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: transparent;
            overflow: hidden;
        }
        .container {
            display: flex;
            gap: 30px;
            align-items: center;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            grid-template-rows: repeat(4, 70px);
            gap: 8px;
            border: 2px solid #ddd;
            padding: 8px;
            border-radius: 12px;
            background: #eee;
        }
        .pixel {
            width: 70px;
            height: 70px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .pixel:hover {
            transform: scale(1.05);
            z-index: 10;
        }
        .pixel.active {
            transform: scale(1.1);
            box-shadow: 0 0 0 4px var(--accent);
            z-index: 11;
            border-color: white;
        }
        .info-card {
            width: 300px;
            text-align: center;
            padding: 20px;
            border: 3px solid var(--accent);
            border-radius: 15px;
            color: var(--primary);
            background: var(--bg);
        }
        .info-card h3 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .rgb-text {
            font-size: 1.8rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            margin: 15px 0;
            white-space: nowrap;
        }
        .channels {
            display: flex;
            justify-content: space-around;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .channel {
            display: flex;
            flex-direction: column;
        }
        .preview {
            height: 50px;
            border-radius: 8px;
            border: 1px solid #ddd;
            transition: background-color 0.3s;
        }
        .coord {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="grid" id="pixelGrid">
        <!-- Pixels will be generated by JS -->
    </div>

    <div class="info-card">
        <div class="coord" id="pixelCoord">Pixel: (x=1, y=1)</div>
        <h3>RGB Vector</h3>
        <div class="rgb-text" id="rgbValue">[255, 128, 0]</div>
        <div class="channels">
            <div class="channel" style="color: #e74c3c;">R<span id="rVal">255</span></div>
            <div class="channel" style="color: #2ecc71;">G<span id="gVal">128</span></div>
            <div class="channel" style="color: #3498db;">B<span id="bVal">0</span></div>
        </div>
        <div class="preview" id="colorPreview" style="background-color: rgb(255, 128, 0);"></div>
    </div>
</div>

<script>
    const grid = document.getElementById('pixelGrid');
    const rgbText = document.getElementById('rgbValue');
    const rVal = document.getElementById('rVal');
    const gVal = document.getElementById('gVal');
    const bVal = document.getElementById('bVal');
    const preview = document.getElementById('colorPreview');
    const coordText = document.getElementById('pixelCoord');

    const colors = [
        [255, 94, 94],   [94, 255, 94],   [94, 94, 255],   [255, 255, 94],
        [255, 94, 255],  [94, 255, 255],  [200, 200, 200], [50, 50, 50],
        [255, 128, 0],   [128, 0, 255],   [0, 128, 128],   [128, 128, 0],
        [255, 255, 255], [0, 0, 0],       [100, 200, 100], [200, 100, 200]
    ];

    function updateInfo(r, g, b, x, y) {
        rgbText.textContent = `[${r}, ${g}, ${b}]`;
        rVal.textContent = r;
        gVal.textContent = g;
        bVal.textContent = b;
        preview.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        coordText.textContent = `Pixel: (x=${x}, y=${y})`;
    }

    colors.forEach((c, i) => {
        const x = i % 4;
        const y = Math.floor(i / 4);
        const div = document.createElement('div');
        div.className = 'pixel';
        div.style.backgroundColor = `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
        
        if (i === 8) div.classList.add('active'); // Default selection

        div.onclick = () => {
            document.querySelectorAll('.pixel').forEach(p => p.classList.remove('active'));
            div.classList.add('active');
            updateInfo(c[0], c[1], c[2], x, y);
        };
        grid.appendChild(div);
    });
</script>

</body>
</html>
